<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Вход</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f0f0f0;
      }
      .login-form {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 300px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #20c997;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="login-form">
      <h2>Вход</h2>
      <input
        type="text"
        id="login"
        autocomplete="username"
        placeholder="Логин"
      />
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Пароль"
      />
      <button type="button" id="loginBtn">Войти</button>
      <p><a href="register.html">Регистрация</a></p>
    </div>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
