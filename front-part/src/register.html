<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f0f0f0;
        margin: 0;
      }
      .register-form {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 320px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #20c997;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        margin-top: 10px;
      }
      button:hover {
        background: #1baa80;
      }
      .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
      }
      .login-link a {
        color: #007bff;
        text-decoration: none;
      }
      .login-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="register-form">
      <h2>Регистрация</h2>
      <input type="text" id="regLogin" placeholder="Логин" required />
      <input type="password" id="regPassword" placeholder="Пароль" required />
      <button type="button" id="registerBtn">Зарегистрироваться</button>

      <div class="login-link">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>
    </div>
    <script type="module" src="./js/register.js"></script>
  </body>
</html>
